[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==2.0.0",
]

[project.urls]
repository = "https://github.com/ludekheller/my-nomad-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-north-jupyter>=0.2.6",
  "nomad-gui==2.0.0",
  "nomad-dsc-trios @ git+https://github.com/ludekheller/nomad_plugins.git@8f43b1bd34f33e379a17ce91c31de4da793acecd#subdirectory=nomad-dsc-trios",
  "nomad-thermomech @ git+https://github.com/ludekheller/nomad_plugins.git@0ea4b2b06975f04792f16fdf4e425dcc96476c9a#subdirectory=nomad-thermomech",
  "nomad-walterbai @ git+https://github.com/ludekheller/nomad_plugins.git@6b8f274ba5717346fc389bfbda633d28129b1b66#subdirectory=nomad-walterbai",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==2.0.0"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
