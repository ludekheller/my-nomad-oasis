[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==2.0.0",
]

[project.urls]
repository = "https://github.com/ludekheller/my-nomad-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-north-jupyter>=0.2.6",
  "nomad-gui==2.0.0",
  "nomad-dsc-trios @ git+https://github.com/ludekheller/nomad_plugins.git@ffda2c381bb6d293e99314c134a40616152fd34d#subdirectory=nomad-dsc-trios",
  "nomad-thermomech @ git+https://github.com/ludekheller/nomad_plugins.git@6ce89f65663311d8c5fa26f2744e85cbee0a42cb#subdirectory=nomad-thermomech",
  "nomad-walterbai @ git+https://github.com/ludekheller/nomad_plugins.git@6ce89f65663311d8c5fa26f2744e85cbee0a42cb#subdirectory=nomad-walterbai",
  "nomad-apt @ git+https://github.com/ludekheller/nomad_plugins.git@482fcda3e2c0deed5d50ce1dd634f6ca783b571b#subdirectory=nomad-apt",
  "nomad-dept18-apps @ git+https://github.com/ludekheller/nomad_plugins.git@ede72f207f013ad4f20cdd9fe6cdb4fd87c70504#subdirectory=nomad-dept18-apps",
  "nomad-infratec @ git+https://github.com/ludekheller/nomad_plugins.git@6ce89f65663311d8c5fa26f2744e85cbee0a42cb#subdirectory=nomad-infratec",
  "nomad-linseis @ git+https://github.com/ludekheller/nomad_plugins.git@54198b1ea5a2694b4f828b7942032fb327e2f4b9#subdirectory=nomad-linseis",
]
jupyter = ["jupyter-events", "ipympl", "nomad-dept18-jupyter @ git+https://github.com/ludekheller/nomad_plugins.git@8b9a53c1d50ba905675bc9bee6b49e531f6b2a2e#subdirectory=nomad-dept18-jupyter"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==2.0.0"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
