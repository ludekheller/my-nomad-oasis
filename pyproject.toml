[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==2.0.0",
]

[project.urls]
repository = "https://github.com/ludekheller/my-nomad-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-north-jupyter>=0.2.6",
  "nomad-gui==2.0.0",
  "nomad-dsc-trios @ git+https://github.com/ludekheller/nomad_plugins.git@8f43b1bd34f33e379a17ce91c31de4da793acecd#subdirectory=nomad-dsc-trios",
  "nomad-thermomech @ git+https://github.com/ludekheller/nomad_plugins.git@0ea4b2b06975f04792f16fdf4e425dcc96476c9a#subdirectory=nomad-thermomech",
  "nomad-walterbai @ git+https://github.com/ludekheller/nomad_plugins.git@54198b1ea5a2694b4f828b7942032fb327e2f4b9#subdirectory=nomad-walterbai",
  "nomad-apt @ git+https://github.com/ludekheller/nomad_plugins.git@482fcda3e2c0deed5d50ce1dd634f6ca783b571b#subdirectory=nomad-apt",
  "nomad-dept18-apps @ git+https://github.com/ludekheller/nomad_plugins.git@308471b5af576fe020dbab6d6ba0a40aad2aca1c#subdirectory=nomad-dept18-apps",
  "nomad-infratec @ git+https://github.com/ludekheller/nomad_plugins.git@8a7490d38dcd1094e01671cf93225021e7b64a17#subdirectory=nomad-infratec",
  "nomad-linseis @ git+https://github.com/ludekheller/nomad_plugins.git@54198b1ea5a2694b4f828b7942032fb327e2f4b9#subdirectory=nomad-linseis",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==2.0.0"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
